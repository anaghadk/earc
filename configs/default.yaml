data:
  seed: 42
  n_examples_per_dataset: 5000
  datasets:
    - nq
    - hotpotqa
    - triviaqa
  nq_split: train

retrieval:
  backend: dense
  top_k: 10
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  rag_project_dir: RAG_Project
  retrieval_method: dense

compression:
  alpha: 0.7
  beta: 0.3
  redundancy_threshold: 0.85
  token_budget: 300
  spacy_model: en_core_web_sm

generation:
  providers:
    - ollama
    - mistral
  default_provider: ollama

ollama:
  base_url: http://localhost:11434
  model: llama3.2
  temperature: 0.0
  max_tokens: 256

mistral:
  model: ministral-8b-latest
  temperature: 0.0
  max_tokens: 256

hardware:
  device: cuda
  embedding_batch_size: 16
  fp16: true

evaluation:
  bootstrap_resamples: 2000
  significance_resamples: 5000
  significance_alpha: 0.05
  token_budgets_for_curve:
    - 50
    - 100
    - 150
    - 200
    - 250
    - 300
    - 400
    - 500

output:
  base_dir: outputs
  log_level: INFO
  save_predictions: true
  save_figures: true
  figure_formats:
    - png
    - pdf
