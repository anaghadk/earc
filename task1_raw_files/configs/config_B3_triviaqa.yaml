data:
  seed: 42
  datasets:
  - nq
  - hotpotqa
  - triviaqa
retrieval:
  backend: dense
  top_k: 10
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
compression:
  alpha: 0.5
  beta: 0.5
  use_redundancy: true
  redundancy_threshold: 0.85
  token_budget: 300
  spacy_model: en_core_web_sm
experiment:
  experiment: exp1
  config_id: B3
  config_name: beta = 0.5
