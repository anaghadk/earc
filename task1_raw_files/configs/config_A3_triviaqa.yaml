data:
  seed: 42
  datasets:
  - nq
  - hotpotqa
  - triviaqa
retrieval:
  backend: dense
  top_k: 10
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
compression:
  alpha: 0.7
  beta: 0.3
  use_redundancy: false
  redundancy_threshold: 1.0
  token_budget: 300
  spacy_model: en_core_web_sm
experiment:
  experiment: exp1
  config_id: A3
  config_name: Hybrid without redundancy
